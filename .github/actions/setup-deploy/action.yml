name: Setup deployment tools
description: Install only the locked Wrangler toolchain, without application dependencies.
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: tools/deploy/package.json
        dest: ~/setup-pnpm-${{ github.job }}
    - name: Install locked deployment tools
      shell: bash
      run: pnpm --dir tools/deploy install --frozen-lockfile
