# Publish create-zudo-sg to npm.
#
# Triggered by a pushed `create-zudo-sg-v*.*.*` tag. This initializer has its
# own tag namespace and concurrency group so it cannot cross-fire with the
# styleguide engine's `v*.*.*` publish workflow.
#
# The publish is gated by the foreign scaffold proof in
# `scripts/verify-create-zudo-sg.mjs`. Its `--published-engine` mode leaves the
# template's registry dependency untouched, proving that the shipped caret
# range resolves to the published @takazudo/zudo-sg package.
#
# Release procedure: packages/styleguide/RELEASE.md. The tag arrives either
# as a push from an operator or from release.yml, which creates it and then
# dispatches this workflow explicitly (a GITHUB_TOKEN tag push fires nothing).
# npm authentication is Trusted Publishing (OIDC) only; npm's trusted
# publisher entry names this file, so the publish job must stay here.

name: Publish create-zudo-sg to npm

on:
  push:
    tags:
      - "create-zudo-sg-v*.*.*"
  workflow_dispatch:

# Only one publish of this package should run at a time.
concurrency:
  group: publish-create-zudo-sg
  cancel-in-progress: false

# Nothing at workflow level; each job states exactly what it needs.
permissions: {}

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # id-token is the npm Trusted Publishing (OIDC) credential; actions:read
    # lets the candidate guard read the tagged commit's CI runs.
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      published: ${{ steps.decide.outputs.publish }}
    steps:
      # workflow_dispatch allows a manual retry, but --no-git-checks below
      # would otherwise publish from any ref. Require the exact initializer
      # release tag before checkout/install/build work starts.
      - name: Guard workflow_dispatch to create-zudo-sg-v*.*.* tag refs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || ! echo "$GITHUB_REF_NAME" | grep -Eq '^create-zudo-sg-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::workflow_dispatch must be run from a create-zudo-sg-v*.*.* tag ref, not '$GITHUB_REF'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the candidate guard can prove the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No registry-url input; it would write a token-based .npmrc. pnpm publishes
          # to registry.npmjs.org by default and authenticates through OIDC.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag and package version must both be stable X.Y.Z values, and the
      # exact tag must identify the package version being published.
      - name: Guard stable-only version
        run: |
          VERSION=$(node -p "require('./packages/create-zudo-sg/package.json').version")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::packages/create-zudo-sg/package.json version '$VERSION' is not a stable X.Y.Z"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "create-zudo-sg-v$VERSION" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match packages/create-zudo-sg/package.json version 'create-zudo-sg-v$VERSION'"
            exit 1
          fi
          echo "Publishing create-zudo-sg@$VERSION to dist-tag latest"

      # Repository-owned guards (scripts/release/release.mjs, tested in
      # scripts/__tests__/release.test.ts): exact tag namespace + manifest
      # version, the tagged commit is on main with green push CI, and the
      # registry state decides whether this run publishes. An existing version
      # whose provenance matches this tag/commit skips to finalization; an
      # uncertain registry answer or a foreign existing version stops here.
      - name: Guard release tag
        id: tag
        run: node scripts/release/release.mjs guard-tag --package create-zudo-sg --github-output

      - name: Guard candidate commit (on main, exact CI green)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/release.mjs verify-candidate --package create-zudo-sg
          --version "${{ steps.tag.outputs.version }}" --sha "$GITHUB_SHA" --wait-ci 600

      - name: Decide publication from registry state
        id: decide
        run: >-
          node scripts/release/release.mjs publish-decision --package create-zudo-sg
          --version "${{ steps.tag.outputs.version }}" --sha "$GITHUB_SHA" --github-output

      - name: Build + typecheck + test create-zudo-sg
        if: steps.decide.outputs.publish == 'true'
        run: pnpm --filter create-zudo-sg check

      - name: Check create-zudo-sg template
        if: steps.decide.outputs.publish == 'true'
        run: pnpm check:create-template

      # This is intentionally after the template check and before publish:
      # it scaffolds from the packed initializer, installs the template's
      # unchanged ^X.Y.Z engine range from npm, and builds the foreign host.
      - name: Verify scaffold with published engine
        if: steps.decide.outputs.publish == 'true'
        run: pnpm verify:create-zudo-sg --published-engine

      # Tokenless: npm Trusted Publishing (GitHub OIDC) is the only credential.
      # pnpm 11 exchanges the job's id-token itself; there is deliberately no
      # NODE_AUTH_TOKEN / NPM_TOKEN fallback, so a missing trusted-publisher
      # configuration fails here instead of silently using a long-lived token.
      - name: Publish package
        if: steps.decide.outputs.publish == 'true'
        run: pnpm publish --filter create-zudo-sg --tag latest --access public --no-git-checks --provenance

      - name: Confirm the version is on the registry
        if: steps.decide.outputs.publish == 'true'
        run: node scripts/release/release.mjs await-published --package create-zudo-sg --version "${{ steps.tag.outputs.version }}"

  # GitHub Release completion, separate from publication: a failure here never
  # republishes or bumps anything. Re-run this job (or re-dispatch the exact
  # tag) to resume; an existing Release is kept, never overwritten.
  finalize:
    name: Finalize GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Create or keep the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/release.mjs finalize --package create-zudo-sg
          --version "${{ needs.publish.outputs.version }}" --sha "$GITHUB_SHA"
